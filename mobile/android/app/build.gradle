apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8/ProGuard — leave OFF until keep-rules are fully validated.
 * Enabling minify previously produced a blank/stuck launch screen on device
 * (JS started, but native UI never painted Welcome).
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Play Store upload signing — copy android/keystore.properties.example to
 * android/keystore.properties and point storeFile at your upload keystore.
 * Never commit keystore.properties or *.keystore (except debug.keystore).
 */
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.b4fitness"
    defaultConfig {
        applicationId "com.b4fitness"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "1.0.4"
    }
    externalNativeBuild {
        cmake {
            // Keep Ninja object paths below Windows' path limit.
            buildStagingDirectory file("../../.cxx")
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseKeystore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            // Require upload keystore — no debug-keystore fallback for Play AABs.
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            outputFileName = "FitNova-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

// Fail only when assembling/bundling release (debug builds still work without keystore.properties).
tasks.configureEach { task ->
    def n = task.name.toLowerCase()
    def isReleaseShipTask =
        n == 'assemblerelease' ||
        n == 'bundlerelease' ||
        n == 'installrelease' ||
        n.endsWith('assemblerelease') ||
        n.endsWith('bundlerelease')
    if (isReleaseShipTask) {
        task.doFirst {
            if (!hasReleaseKeystore) {
                throw new GradleException(
                    "Release builds require android/keystore.properties " +
                    "(copy from keystore.properties.example). " +
                    "Debug-signed release AABs are not allowed."
                )
            }
            def storePath = keystoreProperties['storeFile']
            def store = storePath != null ? rootProject.file(storePath) : null
            if (store == null || !store.exists()) {
                throw new GradleException(
                    "Release keystore file not found: ${storePath}. " +
                    "Update storeFile in android/keystore.properties."
                )
            }
            if (android.buildTypes.release.signingConfig == null) {
                throw new GradleException(
                    "Release signingConfig is not set. Check android/keystore.properties."
                )
            }
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
